name: segment-geospatial
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - git
  - gdal=3.10
  - libtiff=4.7
  - libjpeg-turbo=3.2
  - pip:
      # NOTE: --pre is deliberately omitted here. It causes pip to resolve
      # pre-release thinc/spacy/numpy that break binary compatibility.
      # transformers>=5.0.0rc0 (a pre-release needed by samgeo3) is installed
      # separately in run.sh with --pre scoped to just that one package.
      # Pull torch from the CUDA 12.6 index: LS6's NVIDIA driver is CUDA 12.0
      # (reported as 12080). NVIDIA CUDA 12.x is backward-compatible: 12.6
      # wheels run on 12.0 drivers per NVIDIA docs.
      # torch>=2.8 is needed: segment-geospatial[samgeo3] 1.4.2 requires
      # triton>=3.5.1, which is incompatible with torch 2.7.x (triton==3.3.1).
      - "--extra-index-url https://download.pytorch.org/whl/cu126"
      # NumPy must stay <2.4: NumPy >=2.4 PyPI wheels require x86-64-v2 (AVX2)
      # and hard-fail on import. 2.3.x is the last baseline build.
      - "numpy<2.4"
      - "torch==2.8.0+cu126"
      - "torchvision==0.23.0+cu126"
      - jupyterlab
      - ipykernel
      - ipywidgets
      - leafmap
      - localtileserver
      - jupyter-server-proxy
      # SAM 3 stack. Do NOT use segment-geospatial[all]: pip backtracks to
      # old/incompatible releases (0.15.x) and drops Meta sam3 imports.
      # Pin the main package to its samgeo3 extra + explicit sam3 dependency
      # so Meta SAM3 imports are available on first launch.
      - "segment-geospatial[samgeo3]==1.4.2"
      - "sam3>=0.1.4"
      # Explicit deps that pip may fail to resolve under --pre + extra-index-url
      - xarray
