name: segment-geospatial
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - git
  # GDAL (provides the osgeo Python bindings samgeo imports). conda-forge
  # build is fine on Lonestar6 (the compute nodes expose AVX2).
  - gdal
  - pip:
      # samgeo3 requires transformers>=5.0.0rc0 (a pre-release)
      - "--pre"
      # Pull torch from the CUDA 12.0 index: LS6's NVIDIA driver is CUDA 12.0,
      # so the default PyPI torch (cu130) fails with "driver too old". cu120 runs
      # on a 12.0 driver and matches the ghcr.io/.../segment-geospatial-cookbook-gpu
      # image (built FROM nvidia/cuda:12.0).
      - "--extra-index-url https://download.pytorch.org/whl/cu120"
      # NumPy must stay <2.4: NumPy >=2.4 PyPI wheels require x86-64-v2 (AVX2)
      # and hard-fail on import. 2.3.x is the last baseline build.
      - "numpy<2.4"
      - "torch==2.7.0+cu120"
      - "torchvision==0.22.0+cu120"
      - jupyterlab
      - ipykernel
      - ipywidgets
      - leafmap
      - localtileserver
      - jupyter-server-proxy
      # SAM 3 stack. NOTE: the extra is 'samgeo3' (there is no 'sam3' extra).
      - "segment-geospatial[samgeo3]"
