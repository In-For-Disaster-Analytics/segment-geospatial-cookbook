name: segment-geospatial
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - git
  - gdal=3.10
  - libtiff=4.6
  - libjpeg-turbo=3.0
  - pip:
      # NOTE: --pre is deliberately omitted here. It causes pip to resolve
      # pre-release thinc/spacy/numpy that break binary compatibility.
      # transformers>=5.0.0rc0 (a pre-release needed by samgeo3) is installed
      # separately in run.sh with --pre scoped to just that one package.
      # Pull torch from the CUDA 12.1 index: LS6's NVIDIA driver is CUDA 12.0
      # (reported as 12080). There is no cu120 index on pytorch.org — cu121 is
      # the lowest available. CUDA 12.1 wheels are backward-compatible with
      # CUDA 12.0 drivers per NVIDIA docs. cu121 goes up to torch 2.5.1.
      # CUDA 12.1 index only goes to torch 2.5.1, which is too old (sam3 needs
      # >=2.6 for CVE-2025-32434 torch.load fix). cu126 has torch 2.7.1+.
      # NVIDIA CUDA 12.x is backward-compatible: 12.6 wheels run on 12.0 drivers.
      - "--extra-index-url https://download.pytorch.org/whl/cu126"
      # NumPy must stay <2.4: NumPy >=2.4 PyPI wheels require x86-64-v2 (AVX2)
      # and hard-fail on import. 2.3.x is the last baseline build.
      - "numpy<2.4"
      - "torch==2.7.1+cu126"
      - "torchvision==0.22.1+cu126"
      - jupyterlab
      - ipykernel
      - ipywidgets
      - leafmap
      - localtileserver
      - jupyter-server-proxy
      # SAM 3 stack. NOTE: the extra is 'samgeo3' (there is no 'sam3' extra).
      # Install everything so all example notebooks work out of the box.
      - "segment-geospatial[all]"
      # Explicit deps that pip may fail to resolve under --pre + extra-index-url
      - xarray
