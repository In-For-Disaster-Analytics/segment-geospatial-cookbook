name: segment-geospatial
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - git
  - gdal=3.10
  - libtiff=4.7
  - libjpeg-turbo=3.2
  - pip:
      # NOTE: --pre is deliberately omitted here (see environment.yaml comments).
      # transformers>=5.0.0rc0 is installed separately in run.sh with --pre scoped.
      - "--extra-index-url https://download.pytorch.org/whl/cpu"
      - "numpy<2.4"
      - "torch==2.7.1+cpu"
      - "torchvision==0.22.1+cpu"
      - jupyterlab
      - ipykernel
      - ipywidgets
      - leafmap
      - localtileserver
      - jupyter-server-proxy
      - "segment-geospatial[all]"
      - xarray
