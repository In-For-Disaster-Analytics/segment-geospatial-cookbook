name: segment-geospatial
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - git
  - gdal=3.10
  - pygdal=3.10.*
  - libtiff=4.7
  - libjpeg-turbo=3.2
  - pip:
      # NOTE: --pre is deliberately omitted here (see environment.yaml comments).
      # transformers>=5.0.0rc0 is installed separately in run.sh with --pre scoped.
      - "--extra-index-url https://download.pytorch.org/whl/cpu"
      - "numpy<2.4"
      - "torch==2.10.0+cpu"
      - "torchvision==0.25.0+cpu"
      - jupyterlab
      - ipykernel
      - ipywidgets
      - leafmap
      - localtileserver
      - jupyter-server-proxy
      # SAM 3 stack. Do NOT use segment-geospatial[all]: pip backtracks to
      # old/incompatible releases (0.15.x) and drops Meta sam3 imports.
      - "segment-geospatial[samgeo3]==1.4.2"
      - "sam3>=0.1.4"
      - xarray
